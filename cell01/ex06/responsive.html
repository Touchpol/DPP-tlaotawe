<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body {
        padding: 0;
        margin: 0;
    }
    table {
        width: 100%;
        height: 100vh;
        border-collapse: collapse;
    }
    td {
        height: 200px;
    }
    td:first-child {
        background-color: green;
    }
    td:last-child {
        background-color: pink;
    }
</style>
<body style="padding: 0; margin: 0;">
    <table style="width: 100%; border-collapse: collapse;">
        <tr style="height: 200px;">
            <td style="background-color: rgb(255, 255, 255);">1st cell</td>
            <td style="background-color: rgb(0, 0, 0);">2nd cell</td>
        </tr>
    </table>
</body>
</html>
